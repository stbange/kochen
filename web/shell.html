<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kochen — First-Principles Culinary Synthesizer</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #11141b; color: #eef2f7;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden; touch-action: none; user-select: none;
    }
    #canvas {
      display: block; width: 100vw; height: 100vh; outline: none;
    }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #11141b;
      z-index: 10; transition: opacity 0.25s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .brand { font-size: 1.35rem; letter-spacing: 0.08em; color: #f4b942; font-weight: 700; }
    .sub { margin-top: 0.5rem; font-size: 0.9rem; color: #9aa5b8; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="brand">KOCHEN · CULINARY SYNTHESIZER</div>
    <div class="sub" id="status">Loading physics ontology &amp; archetypes...</div>
  </div>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

  <script>
    window.kochenDownloadMarkdown = function(mdText) {
      var blob = new Blob([mdText], { type: 'text/markdown;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kochen_recipe.md';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    };

    window.kochenOnReady = function() {
      var el = document.getElementById('loading');
      if (el) el.classList.add('hidden');
      var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                    (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
      if (isTouch && Module._kochen_web_set_touch_hint) {
        Module._kochen_web_set_touch_hint(1);
      }
      var qs = window.location.search || '';
      if (qs.indexOf('patch=') !== -1 && Module._kochen_web_load_patch) {
        var len = lengthBytesUTF8(qs) + 1;
        var ptr = Module._malloc ? Module._malloc(len) : 0;
        if (ptr) {
          stringToUTF8(qs, ptr, len);
          Module._kochen_web_load_patch(ptr);
          if (Module._free) Module._free(ptr);
        }
      }
    };

    var ASSET_FILES = [
      ['assets/data', 'pantries.tsv'],
      ['assets/data', 'ingredients.tsv'],
      ['assets/data', 'archetypes.ini'],
      ['assets/locales', 'en.tsv'],
      ['assets/locales', 'de.tsv'],
      ['assets/locales', 'pl.tsv'],
      ['assets/fonts', 'DejaVuSans.ttf'],
      ['assets/shaders', 'synth.vert'],
      ['assets/shaders', 'synth.frag']
    ];

    var Module = {
      canvas: (function() { return document.getElementById('canvas'); })(),
      preRun: [function() {
        FS.mkdir('/assets');
        FS.mkdir('/assets/data');
        FS.mkdir('/assets/locales');
        FS.mkdir('/assets/fonts');
        FS.mkdir('/assets/shaders');
        for (var i = 0; i < ASSET_FILES.length; i++) {
          var dir = ASSET_FILES[i][0], file = ASSET_FILES[i][1];
          FS.createPreloadedFile('/' + dir, file, dir + '/' + file, true, false);
        }
      }],
      setStatus: function(text) {
        var s = document.getElementById('status');
        if (s && text) s.textContent = text;
      }
    };
  </script>
  <script async src="kochen.js"></script>
</body>
</html>
