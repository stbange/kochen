name: CI & GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-coverage:
    name: Unit, Broad-Sample & Automated Studio Tests (>=95% Coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build & coverage tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build gcovr

      - name: Build & Run Tests (ASan + UBSan + Coverage)
        run: |
          cmake -G Ninja -B build-test -DCMAKE_BUILD_TYPE=Debug \
            -DKOCHEN_BUILD_APP=OFF -DKOCHEN_COVERAGE=ON -DKOCHEN_SANITIZERS=ON
          cmake --build build-test --parallel
          ctest --test-dir build-test --output-on-failure

      - name: Enforce >=95% Line Coverage
        run: gcovr --root src --filter 'src/(core|ui/kochen_studio|ui/kochen_audio)' --fail-under-line 95 build-test

  build-desktop:
    name: Desktop Build (${{ matrix.os }})
    needs: test-and-coverage
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL3/GL dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libgl1-mesa-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev pkg-config

      - name: Configure & Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DKOCHEN_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel

      - name: Verify Loose External Assets Staged Beside Binary
        shell: bash
        run: |
          if [ -d build/Release ]; then OUT=build/Release; else OUT=build; fi
          test -f "$OUT/assets/data/ingredients.tsv"
          test -f "$OUT/assets/data/archetypes.ini"
          test -f "$OUT/assets/locales/de.tsv"
          test -f "$OUT/assets/locales/pl.tsv"
          test -f "$OUT/assets/fonts/DejaVuSans.ttf"

  build-web:
    name: Web Build (Emscripten)
    needs: test-and-coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build Emscripten Web App
        run: |
          emcmake cmake -G Ninja -B build-web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web --parallel
          test -f build-web/dist/index.html
          test -f build-web/dist/kochen.js
          test -f build-web/dist/kochen.wasm
          test -f build-web/dist/assets/data/ingredients.tsv
          test -f build-web/dist/assets/locales/de.tsv
          test -f build-web/dist/assets/locales/pl.tsv

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build-web/dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build-web
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
